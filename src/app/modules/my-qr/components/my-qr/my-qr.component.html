<div class="min-h-screen bg-gradient-to-br from-neutral-50 to-neutral-100 flex">
  <!-- Mobile menu -->
  <div class="fixed inset-0 z-40 md:hidden" *ngIf="navigationService.isMobileMenuOpen$ | async" (click)="toggleMobileMenu()">
    <div class="fixed inset-0 bg-neutral-600 bg-opacity-75" aria-hidden="true"></div>
    <div class="relative flex-1 flex flex-col max-w-xs w-full bg-gradient-to-b from-white to-neutral-50 border-r border-neutral-200 transform transition duration-300 ease-in-out">
      <div class="absolute top-0 right-0 -mr-12 pt-2">
        <button (click)="toggleMobileMenu()" class="ml-1 flex items-center justify-center h-10 w-10 rounded-full focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white">
          <span class="sr-only">Cerrar menú</span>
          <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="flex-1 h-0 pt-5 pb-4 overflow-y-auto">
        <div class="flex-shrink-0 flex items-center px-4">
          <h1 class="text-xl font-bold text-neutral-900 bg-clip-text text-transparent bg-gradient-to-r from-primary-600 to-secondary-600">PagoRural</h1>
        </div>
        <nav class="mt-5 px-2 space-y-1">
          <a routerLink="/dashboard" routerLinkActive="bg-gradient-to-r from-primary-100 to-primary-50 text-primary-900 border-l-4 border-primary-500" (click)="toggleMobileMenu()" class="text-neutral-600 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100 hover:text-neutral-900 group flex items-center px-2 py-2 text-base font-medium rounded-md transition-all duration-200">
            <svg class="text-neutral-400 group-hover:text-primary-500 mr-4 h-6 w-6 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            Inicio
          </a>
          <a routerLink="/my-qr" routerLinkActive="bg-gradient-to-r from-primary-100 to-primary-50 text-primary-900 border-l-4 border-primary-500" (click)="toggleMobileMenu()" class="text-neutral-600 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100 hover:text-neutral-900 group flex items-center px-2 py-2 text-base font-medium rounded-md transition-all duration-200">
            <svg class="text-neutral-400 group-hover:text-primary-500 mr-4 h-6 w-6 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 001 1zm0 10h2a1 1 0 001-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 001 1zM5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 001 1zm0 10h2a1 1 0 001-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 001 1z" />
            </svg>
            Mi QR
          </a>
          <a routerLink="/pay" routerLinkActive="bg-gradient-to-r from-primary-100 to-primary-50 text-primary-900 border-l-4 border-primary-500" (click)="toggleMobileMenu()" class="text-neutral-600 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100 hover:text-neutral-900 group flex items-center px-2 py-2 text-base font-medium rounded-md transition-all duration-200">
            <svg class="text-neutral-400 group-hover:text-primary-500 mr-4 h-6 w-6 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Pagar
          </a>
          <a routerLink="/contact" routerLinkActive="bg-gradient-to-r from-primary-100 to-primary-50 text-primary-900 border-l-4 border-primary-500" (click)="toggleMobileMenu()" class="text-neutral-600 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100 hover:text-neutral-900 group flex items-center px-2 py-2 text-base font-medium rounded-md transition-all duration-200">
            <svg class="text-neutral-400 group-hover:text-primary-500 mr-4 h-6 w-6 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            Contactos
          </a>
          <a routerLink="/history" routerLinkActive="bg-gradient-to-r from-primary-100 to-primary-50 text-primary-900 border-l-4 border-primary-500" (click)="toggleMobileMenu()" class="text-neutral-600 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100 hover:text-neutral-900 group flex items-center px-2 py-2 text-base font-medium rounded-md transition-all duration-200">
            <svg class="text-neutral-400 group-hover:text-primary-500 mr-4 h-6 w-6 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Historial
          </a>
          <a routerLink="/profile" routerLinkActive="bg-gradient-to-r from-primary-100 to-primary-50 text-primary-900 border-l-4 border-primary-500" (click)="toggleMobileMenu()" class="text-neutral-600 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100 hover:text-neutral-900 group flex items-center px-2 py-2 text-base font-medium rounded-md transition-all duration-200">
            <svg class="text-neutral-400 group-hover:text-primary-500 mr-4 h-6 w-6 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Perfil
          </a>
        </nav>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0">
    <div class="flex flex-col flex-grow border-r border-neutral-200 bg-gradient-to-b from-white to-neutral-50 pt-5">
      <div class="flex flex-shrink-0 items-center px-4">
        <h1 class="text-xl font-bold text-neutral-900 bg-clip-text text-transparent bg-gradient-to-r from-primary-600 to-secondary-600">RuralPay</h1>
      </div>
      <div class="mt-5 flex flex-grow flex-col">
        <nav class="flex-1 space-y-1 px-2 pb-4">
          <a routerLink="/dashboard" routerLinkActive="bg-gradient-to-r from-primary-100 to-primary-50 text-primary-900 border-l-4 border-primary-500" class="text-neutral-600 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100 hover:text-neutral-900 group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-all duration-200">
            <svg class="text-neutral-400 group-hover:text-primary-500 mr-3 h-6 w-6 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            Inicio
          </a>
          <a routerLink="/my-qr" routerLinkActive="bg-gradient-to-r from-primary-100 to-primary-50 text-primary-900 border-l-4 border-primary-500" class="text-neutral-600 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100 hover:text-neutral-900 group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-all duration-200">
            <svg class="text-neutral-400 group-hover:text-primary-500 mr-3 h-6 w-6 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 001 1zm0 10h2a1 1 0 001-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 001 1zM5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 001 1zm0 10h2a1 1 0 001-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 001 1z" />
            </svg>
            Mi QR
          </a>
          <a routerLink="/pay" routerLinkActive="bg-gradient-to-r from-primary-100 to-primary-50 text-primary-900 border-l-4 border-primary-500" class="text-neutral-600 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100 hover:text-neutral-900 group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-all duration-200">
            <svg class="text-neutral-400 group-hover:text-primary-500 mr-3 h-6 w-6 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Pagar
          </a>
          <a routerLink="/contact" routerLinkActive="bg-gradient-to-r from-primary-100 to-primary-50 text-primary-900 border-l-4 border-primary-500" class="text-neutral-600 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100 hover:text-neutral-900 group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-all duration-200">
            <svg class="text-neutral-400 group-hover:text-primary-500 mr-3 h-6 w-6 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            Contactos
          </a>
          <a routerLink="/history" routerLinkActive="bg-gradient-to-r from-primary-100 to-primary-50 text-primary-900 border-l-4 border-primary-500" class="text-neutral-600 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100 hover:text-neutral-900 group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-all duration-200">
            <svg class="text-neutral-400 group-hover:text-primary-500 mr-3 h-6 w-6 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Historial
          </a>
          <a routerLink="/profile" routerLinkActive="bg-gradient-to-r from-primary-100 to-primary-50 text-primary-900 border-l-4 border-primary-500" class="text-neutral-600 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100 hover:text-neutral-900 group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-all duration-200">
            <svg class="text-neutral-400 group-hover:text-primary-500 mr-3 h-6 w-6 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Perfil
          </a>
        </nav>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex flex-col flex-1 md:pl-64">
    <!-- Header -->
    <header class="bg-white shadow-lg">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex items-center">
            <!-- Mobile menu button -->
            <button (click)="toggleMobileMenu()" class="md:hidden mr-2 inline-flex items-center justify-center p-2 rounded-md text-neutral-400 hover:text-neutral-500 hover:bg-neutral-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-500 transition-colors duration-200">
              <span class="sr-only">Abrir menú principal</span>
              <svg class="block h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <h1 class="text-xl font-bold text-neutral-900 bg-clip-text text-transparent bg-gradient-to-r from-primary-600 to-secondary-600">Mi Código QR</h1>
          </div>
          <div class="flex items-center">
            <!-- Notification Bell -->
            <button class="p-1 rounded-full text-neutral-400 hover:text-neutral-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors duration-200">
              <span class="sr-only">Ver notificaciones</span>
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
            </button>

            <!-- User Profile -->
            <div class="ml-3 relative">
              <div class="flex items-center">
                <div class="relative" id="profile-menu-container">
                  <button (click)="toggleProfileMenu()" class="flex items-center focus:outline-none" type="button">
                    <span class="mr-3 text-neutral-700 font-medium hidden sm:inline">{{ firstName }} {{ lastName }}</span>
                    <div class="bg-gradient-to-br from-primary-200 to-secondary-200 border-2 border-dashed rounded-xl w-10 h-10 flex items-center justify-center" *ngIf="!profileImage">
                      <span class="text-primary-800 font-bold">{{ firstName.charAt(0) }}{{ lastName.charAt(0) }}</span>
                    </div>
                    <div class="w-10 h-10 rounded-xl overflow-hidden" *ngIf="profileImage">
                      <img [src]="profileImage" alt="Profile" class="w-full h-full object-cover">
                    </div>
                  </button>

                  <!-- Dropdown menu -->
                  <div *ngIf="isProfileMenuOpen" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none z-50" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
                    <a routerLink="/profile" (click)="closeProfileMenu()" class="block px-4 py-2 text-sm text-neutral-700 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100" role="menuitem">Perfil</a>
                    <button (click)="logout()" class="block w-full text-left px-4 py-2 text-sm text-neutral-700 hover:bg-gradient-to-r hover:from-neutral-50 hover:to-neutral-100" role="menuitem" type="button">Desconectar</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
      <div class="px-4 py-6 sm:px-0">
        <div class="bg-white rounded-xl shadow-lg p-6 border border-neutral-100">
          <div class="text-center">
            <h2 class="text-lg font-medium text-neutral-900 mb-4">Comparte tu código QR para recibir pagos</h2>

            <!-- QR Code Display -->
            <div class="flex justify-center mb-6">
              <div class="bg-gradient-to-br from-primary-50 to-secondary-50 border-2 border-dashed rounded-xl w-64 h-64 flex items-center justify-center shadow-lg">
                <img *ngIf="qrCodeDataUrl" [src]="qrCodeDataUrl" alt="Código QR" class="w-56 h-56">
                <span *ngIf="!qrCodeDataUrl" class="text-primary-700 font-bold text-lg">Código QR</span>
              </div>
            </div>

            <p class="text-neutral-600 mb-6">
              Otros usuarios pueden escanear este código QR para enviarte pagos directamente a tu billetera.
            </p>

            <!-- Simplified centered wallet address input -->
            <div class="flex justify-center mb-6">
              <div class="w-full max-w-2xl">
                <label for="walletAddress" class="form-label block text-left mb-1 text-center">Dirección de Billetera</label>
                <div class="flex rounded-lg shadow-sm">
                  <input type="text" id="walletAddress" class="block w-full min-w-0 flex-1 rounded-l-lg border border-neutral-300 px-3 py-2 focus:border-primary-500 focus:ring-primary-500 sm:text-sm input-field text-center" [value]="walletAddress || ''">
                  <button
                    (click)="copyToClipboard('walletAddress')"
                    class="relative -ml-px inline-flex items-center rounded-r-lg border border-neutral-300 bg-gradient-to-br from-neutral-100 to-neutral-200 px-4 py-2 text-sm font-medium text-neutral-700 hover:from-neutral-200 hover:to-neutral-300 focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 transition-all duration-200"
                  >
                    Copiar
                  </button>
                </div>
              </div>
            </div>

            <!-- Center the action buttons -->
            <div class="flex justify-center space-x-4">
              <button
                (click)="generateQR()"
                class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg shadow-lg text-white bg-gradient-to-r from-primary-600 to-primary-700 hover:from-primary-700 hover:to-primary-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-all duration-200 transform hover:-translate-y-0.5 btn btn-primary"
              >
                Generar Nuevo QR
              </button>

              <button
                (click)="downloadQR()"
                class="inline-flex items-center px-4 py-2 border border-neutral-300 text-sm font-medium rounded-lg shadow-sm text-neutral-700 bg-gradient-to-br from-white to-neutral-50 hover:from-neutral-50 hover:to-neutral-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-all duration-200"
              >
                Descargar QR
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
