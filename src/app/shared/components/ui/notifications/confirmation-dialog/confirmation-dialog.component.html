<div class="confirmation-overlay" *ngIf="isVisible">
  <div class="confirmation-dialog">
    <div class="confirmation-header">
      <h3 class="confirmation-title">{{ data.title }}</h3>
    </div>
    <div class="confirmation-body">
      <p class="confirmation-message">{{ data.message }}</p>
    </div>
    <div class="confirmation-actions">
      <button class="btn btn-secondary" (click)="onCancel()">{{ data.cancelText }}</button>
      <button class="btn btn-primary" (click)="onConfirm()">{{ data.confirmText }}</button>
    </div>
  </div>
</div>
